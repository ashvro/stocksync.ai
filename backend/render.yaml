# Render blueprint — one-click backend deployment.
# Docs: https://render.com/docs/blueprint-spec
# Creates a web service + a managed PostgreSQL database. The database
# persists across deploys/restarts, so inventory and orders added by an admin
# stay saved and normal users always see the same live data via the API.
databases:
  - name: asfootwear-db
    databaseName: asfootwear
    user: asfootwear
    plan: free
    # Empty list = allow all IPs. Required on the free plan because the free
    # web service has a dynamic IP that would otherwise be blocked by the DB.
    ipAllowList: []

services:
  - type: web
    name: asfootwear-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    preDeployCommand: python manage.py migrate
    healthCheckPath: /api/inventory/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: asfootwear-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: changeme
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      # Set your real key in the Render dashboard:
      #   https://console.groq.com -> API Keys -> gsk_...
      - key: GROQ_API_KEY
        sync: false
